<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>よみトレ</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <section id="grade-screen" class="grade-screen" aria-labelledby="grade-title">
      <div class="grade-panel">
        <p class="eyebrow">小学1〜6年生</p>
        <h1 id="grade-title">よみトレ</h1>
        <p class="grade-lead">れんしゅうする学年をえらぼう。</p>
        <div id="grade-buttons" class="grade-buttons" aria-label="学年選択"></div>
      </div>
    </section>

    <main id="practice-screen" class="app-shell" hidden>
      <section class="practice-panel" aria-labelledby="app-title">
        <div class="topbar">
          <div>
            <p id="grade-label" class="eyebrow">小学6年生の漢字</p>
            <h1 id="app-title">よみトレ</h1>
          </div>
          <div class="score-card" aria-live="polite">
            <span>正答率</span>
            <strong id="score">--%</strong>
          </div>
        </div>

        <div class="progress-row">
          <span id="question-count">1 / 10</span>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
        </div>

        <article class="question-area">
          <p class="question-label">声に出して読もう</p>
          <p id="sentence" class="sentence"></p>
        </article>

        <div class="controls" role="group" aria-label="音声認識の操作">
          <button id="listen-button" class="primary-button" type="button">
            <span class="mic-dot" aria-hidden="true"></span>
            聞き取り開始
          </button>
          <button id="stop-button" class="ghost-button" type="button" disabled>読み終わった</button>
          <button id="next-button" class="ghost-button" type="button">次の問題</button>
          <button id="change-grade-button" class="ghost-button" type="button">学年を変える</button>
        </div>

        <div class="mic-monitor" aria-live="polite">
          <span id="mic-status">マイク待機中</span>
          <div class="level-track" aria-hidden="true">
            <span id="level-bar"></span>
          </div>
        </div>

      </section>

      <section id="result-panel" class="result-panel" aria-label="結果">
      <button id="result-toggle" class="result-toggle" type="button" aria-expanded="false" aria-controls="result-content">
        <span>結果</span>
        <span id="result-toggle-label" class="result-toggle-label">表示</span>
      </button>
      <div id="result-content" class="result-content">
        <div class="result-grid">
          <div>
            <p class="result-label">認識した読み</p>
            <p id="recognized" class="recognized">まだ読んでいません</p>
          </div>
          <div id="result-status-card" class="result-status-card neutral" aria-live="polite">
            <p id="result-status" class="result-status">まだ判定していません</p>
            <p id="result-message" class="result-message">文章を読むと、ここに結果を表示します。</p>
            <div id="error-detail" class="error-detail" hidden>
              <p class="error-detail-label">エラー詳細</p>
              <p id="error-detail-text" class="error-detail-text"></p>
            </div>
          </div>
        </div>
      </div>
      </section>
    </main>

    <div id="term-modal" class="term-modal" hidden>
      <button id="term-backdrop" class="term-backdrop" type="button" aria-label="語句の説明を閉じる"></button>
      <section class="term-dialog" role="dialog" aria-modal="true" aria-labelledby="term-title">
        <button id="term-close" class="term-close" type="button" aria-label="閉じる">×</button>
        <p class="term-dialog-label">語句の読みと意味</p>
        <h2 id="term-title" class="term-title"></h2>
        <p id="term-reading" class="term-reading"></p>
        <p id="term-meaning" class="term-meaning"></p>
        <p id="term-speech-note" class="term-speech-note" hidden>このブラウザは読み上げに対応していません。</p>
      </section>
    </div>

    <script src="./app.js?v=20260906-2"></script>
  </body>
</html>
